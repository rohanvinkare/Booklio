#  for Docker Hub and EC2 deploy

name: Dev Backend Deploy

on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - ".github/workflows/dev-backend.yml"

jobs:
  build_and_push:
    name: 📽️ DEV :- Build & Push Backend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 📆 Checkout Repository
        uses: actions/checkout@v3

      - name: 💾 Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-dev-${{ hashFiles('backend/**/Dockerfile', 'backend/**/package*.json') }}
          restore-keys: |
            ${{ runner.os }}-buildx-dev-

      - name: 💪 Set Up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📤 Build & Push Backend Image (with cache)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: rohanv7/dev-booklio-backend:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

  deploy_to_ec2:
    name: 🚀 DEV :- Deploy Backend to EC2
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: 📡 SSH into EC2 & Deploy Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"
            docker rm -f dev dev-redis 2>/dev/null || true
            docker rmi rohanv7/dev-booklio-backend:latest 2>/dev/null || true
            docker run -d --name dev-redis -p 6380:6379 redis:alpine
            docker pull rohanv7/dev-booklio-backend:latest
            docker run -d \
              --name dev \
              --env-file /home/${{ secrets.EC2_USER }}/dev/.env \
              --link dev-redis:redis \
              -p 3001:3000 \
              rohanv7/dev-booklio-backend:latest 

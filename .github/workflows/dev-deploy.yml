name: Dev Deploy (Backend + Frontend)

on:
  push:
    branches:
      - dev
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/dev-deploy.yml"

jobs:
  build_and_push:
    name: 📽️ DEV :- Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 📆 Checkout Repository
        uses: actions/checkout@v3

      - name: 💾 Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref_name }}-${{ hashFiles('backend/**/Dockerfile', 'backend/**/package*.json') }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ github.ref_name }}-

      - name: 💪 Set Up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📤 Build & Push Backend Image (with cache)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: rohanv7/dev-booklio-backend:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

  deploy_to_ec2:
    name: 🚀 DEV :- Deploy to EC2
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: 📡 SSH into EC2 & Deploy Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🔐 [EC2] Logging in to Docker Hub..."
            docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

            echo "👑 [EC2] Removing existing containers..."
            docker rm -f dev dev-redis 2>/dev/null || true

            echo "🚹 [EC2] Removing old images..."
            docker rmi rohanv7/dev-booklio-backend:latest 2>/dev/null || true

            echo "🐳 [EC2] Starting Redis for DEV..."
            docker run -d \
              --name dev-redis \
              -p 6380:6379 \
              redis:alpine

            echo "📅 [EC2] Pulling latest backend image..."
            docker pull rohanv7/dev-booklio-backend:latest

            echo "🚀 [EC2] Starting DEV backend container..."
            docker run -d \
              --name dev \
              --env-file /home/${{ secrets.EC2_USER }}/dev/.env \
              --link dev-redis:redis \
              -p 3001:3000 \
              rohanv7/dev-booklio-backend:latest

  build_and_deploy_frontend:
    name: 🌟 DEV :- Build & Deploy Frontend to S3 + CDN
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v3

      - name: 🚀 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: 🌎 Create .env File for Build
        working-directory: ./frontend
        run: |
          echo "VITE_BASE_URL=https://booklio-backend-dev.codenix.space" >> .env
          echo "GEOCODE_API=b6b5a9c356a54d6aaeb80b98fa63aa75" >> .env
          cat .env

      - name: 📅 Install Dependencies (Frontend)
        working-directory: ./frontend
        run: npm ci

      - name: 🔧 Build React App
        working-directory: ./frontend
        run: npm run build

      - name: 📤 Upload to S3 (dev/ folder)
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SOURCE_DIR: frontend/dist
          DEST_DIR: dev

      - name: ❌ Invalidate CloudFront Cache (dev/)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.DEV_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: 🪜 Purge Cloudflare Cache (Entire Zone)
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
name: Dev Deploy (Backend + Frontend)

on:
  push:
    branches:
      - dev
    paths:
      - 'backend/**'
      - '.github/workflows/dev-deploy.yml'

jobs:
  backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create .env file from GitHub secrets
        working-directory: ./backend
        run: |
          cat <<EOF > .env
          PORT=${{ secrets.PORT }}
          MONGODB_URL=${{ secrets.MONGODB_URL }}
          ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}
          SMTP_MAIL=${{ secrets.SMTP_MAIL }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          APP_CLOUDINARY_CLOUD_NAME=${{ secrets.APP_CLOUDINARY_CLOUD_NAME }}
          APP_CLOUDINARY_API_KEY=${{ secrets.APP_CLOUDINARY_API_KEY }}
          APP_CLOUDINARY_SECRET_KEY=${{ secrets.APP_CLOUDINARY_SECRET_KEY }}
          MAIL_VERIFICATION=${{ secrets.MAIL_VERIFICATION }}
          FORGOT_URL=${{ secrets.FORGOT_URL }}
          googleapis_key=${{ secrets.GOOGLEAPIS_KEY }}
          PAY_CUT_PERCENTAGE=${{ secrets.PAY_CUT_PERCENTAGE }}
          REDIS_HOST=redis
          REDIS_PORT=6379
          EOF

      - name: Build and Push Docker Images (Backend)
        working-directory: ./backend
        run: |
         docker compose -f dev-docker-compose.yml build
         docker compose -f dev-docker-compose.yml push

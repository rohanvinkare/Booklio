name: Dev Deploy (Backend + Frontend)

on:
  push:
    branches:
      - dev
    paths:
      - 'backend/**'
      - '.github/workflows/dev-deploy.yml'

jobs:
  backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Images (Backend)
        working-directory: ./backend
        run: |
          docker compose -f dev-docker-compose.yml build
          docker compose -f dev-docker-compose.yml push

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🔐 Logging in to Docker Hub..."
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            echo "🛑 Checking for existing container..."
            if [ "$(docker ps -aq -f name=dev)" ]; then
              echo "Stopping and removing existing container 'dev'..."
              docker stop dev
              docker rm dev
            else
              echo "No existing container named 'dev'."
            fi

            echo "🧹 Cleaning up old image if exists..."
            if docker image inspect rohanv7/dev-booklio-backend:latest > /dev/null 2>&1; then
              docker rmi rohanv7/dev-booklio-backend:latest
            fi

            echo "📦 Pulling latest image..."
            docker pull rohanv7/dev-booklio-backend:latest

            echo "🚀 Starting container with env file..."
            docker run -d \
              --name dev \
              --env-file /home/${{ secrets.EC2_USER }}/dev/.env \
              -p 3000:3000 \
              rohanv7/dev-booklio-backend:latest

name: Prod Deploy (Backend + Frontend)

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/prod-deploy.yml"

jobs:
  build_and_push:
    name: 🏗️ PROD :- Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v3

      - name: 🛠️ Set Up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📤 Build & Push Backend Image
        working-directory: ./backend
        run: |
          echo "📦 Building Docker image for backend..."
          docker compose -f prod-docker-compose.yml build
          echo "☁️ Pushing image to Docker Hub..."
          docker compose -f prod-docker-compose.yml push

  deploy_to_ec2:
    name: 🚀 PROD :- Deploy to EC2
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: 📡 SSH into EC2 & Deploy Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🔐 [EC2] Logging in to Docker Hub..."
            docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

            echo "🛑 [EC2] Removing existing container (if any)..."
            docker rm -f prod 2>/dev/null || echo "No running container to remove."

            echo "🧹 [EC2] Removing old image (if exists)..."
            docker rmi rohanv7/prod-booklio-backend:latest 2>/dev/null || true

            echo "📥 [EC2] Pulling latest image..."
            docker pull rohanv7/prod-booklio-backend:latest

            echo "🚀 [EC2] Starting new container..."
            docker run -d \
              --name prod \
              --env-file /home/${{ secrets.EC2_USER }}/prod/.env \
              -p 3000:3000 \
              rohanv7/prod-booklio-backend:latest

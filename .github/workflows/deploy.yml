
name: Build and Deploy Docker Images to EC2

on:
  push:
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        run: |
          echo "Logging into Docker Hub..."
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build frontend Docker image
        run: |
          echo "Building frontend image..."
          docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/booklio-frontend:latest ./frontend

      - name: Build backend Docker image
        run: |
          echo "Building backend image..."
          docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/booklio-backend:latest ./backend

      - name: Push frontend Docker image to Docker Hub
        run: |
          echo "Pushing frontend image to Docker Hub..."
          docker push ${{ secrets.DOCKER_USERNAME }}/booklio-frontend:latest

      - name: Push backend Docker image to Docker Hub
        run: |
          echo "Pushing backend image to Docker Hub..."
          docker push ${{ secrets.DOCKER_USERNAME }}/booklio-backend:latest

  deploy_to_ec2:
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Set up SSH
        run: |
          echo "Setting up SSH..."
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on EC2 with SSH Git clone
        env:
          DOCKER_USERNAME: rohanv7
        run: |
          echo "Deploying on EC2..."
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            echo "Cloning fresh repository from GitHub..."
            if [ -d "booklio-deploy" ]; then
              echo "'booklio-deploy' already exists. Removing..."
              rm -rf booklio-deploy
            fi

            git clone https://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@github.com/rohanvinkare/Booklio.git booklio-deploy || { echo 'Git clone failed'; exit 1; }
            cd booklio-deploy

            echo "Stopping and removing old Docker containers..."
            docker-compose down || echo "Docker Compose down failed"

            echo "Removing old Docker images..."
            docker rmi rohanv7/booklio-frontend:latest || echo "Frontend image not found"
            docker rmi rohanv7/booklio-backend:latest || echo "Backend image not found"

            echo "Cleaning up Docker system..."
            docker system prune -af || echo "Docker prune failed"

            echo "Pulling latest Docker images..."
            docker pull rohanv7/booklio-frontend:latest || { echo 'Frontend image pull failed'; exit 1; }
            docker pull rohanv7/booklio-backend:latest || { echo 'Backend image pull failed'; exit 1; }

            echo "Starting containers..."
            docker-compose up -d || { echo 'Docker Compose up failed'; exit 1; }

            echo "✅ Deployment completed successfully!"
          EOF

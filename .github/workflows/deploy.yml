name: Deploy to EC2

on:
  push:
    branches:
      - main  # Change this to your working branch if necessary

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            # Update and install dependencies if not present
            sudo apt update
            sudo apt install -y git docker-compose
            
            # Clone the repo if it doesn't exist or pull the latest code
            cd ~/Booklio || (git clone https://github.com/${{ github.repository }}.git Booklio && cd Booklio)
            git pull origin main

            # Restart Docker containers
            docker-compose down
            docker-compose up --build -d
          EOF

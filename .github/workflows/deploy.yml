name: Build and Deploy Docker Images to EC2

on:
  push:
    branches:
      - main  # Trigger deployment on pushing to the 'main' branch

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Log in to Docker Hub
      - name: Log in to Docker Hub
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      # Step 3: Build Docker images for frontend and backend

      # Build frontend Docker image
      - name: Build frontend Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/booklio-frontend:latest ./frontend  # Adjust path if needed

      # Build backend Docker image
      - name: Build backend Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/booklio-backend:latest ./backend  # Adjust path if needed

      # Step 4: Push Docker images to Docker Hub
      - name: Push frontend Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/booklio-frontend:latest

      - name: Push backend Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/booklio-backend:latest

  deploy_to_ec2:
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      # Step 1: Set up SSH for EC2 access
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # Step 2: Deploy Docker containers on EC2 using docker-compose
      - name: Deploy Docker containers on EC2 with docker-compose
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            # Pull the latest Docker images from Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/booklio-frontend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/booklio-backend:latest

            # Change directory to where docker-compose.yml is located (in the root directory)
            cd /path/to/your/project/directory

            # Use docker-compose to bring up the services (frontend and backend)
            docker-compose up -d
          EOF

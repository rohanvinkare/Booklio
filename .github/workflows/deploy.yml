name: Build and Deploy Docker Images to EC2

on:
  push:
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build frontend Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/booklio-frontend:latest ./frontend

      - name: Build backend Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/booklio-backend:latest ./backend

      - name: Remove existing frontend image from Docker Hub (if exists)
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/booklio-frontend:latest || echo "Frontend image not found on Docker Hub"
          docker tag ${{ secrets.DOCKER_USERNAME }}/booklio-frontend:latest ${{ secrets.DOCKER_USERNAME }}/booklio-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/booklio-frontend:latest

      - name: Remove existing backend image from Docker Hub (if exists)
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/booklio-backend:latest || echo "Backend image not found on Docker Hub"
          docker tag ${{ secrets.DOCKER_USERNAME }}/booklio-backend:latest ${{ secrets.DOCKER_USERNAME }}/booklio-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/booklio-backend:latest

  deploy_to_ec2:
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on EC2 with SSH Git clone
        env:
          DOCKER_USERNAME: rohanv7
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deploying on EC2..."
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            echo "Setting up deploy key for GitHub access..."
            echo "${{ secrets.GITHUB_TOKEN }}" > ~/.ssh/booklio-deploy-key
            chmod 600 ~/.ssh/booklio-deploy-key

            if [ -d "booklio-deploy" ]; then
              echo "'booklio-deploy' directory already exists. Removing it..."
              rm -rf booklio-deploy
            fi

            echo "Cloning repository from GitHub..."
            git clone https://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@github.com/rohanvinkare/Booklio.git booklio-deploy || { echo 'Git clone failed'; exit 1; }
            cd booklio-deploy

            echo "Stopping and removing existing containers..."
            docker-compose down || echo "Docker Compose down failed"

            echo "Removing old images..."
            docker rmi rohanv7/booklio-frontend:latest || echo "Frontend image removal failed"
            docker rmi rohanv7/booklio-backend:latest || echo "Backend image removal failed"

            echo "Cleaning up unused Docker resources..."
            docker system prune -af || { echo 'Failed to prune Docker system'; exit 1; }

            echo "Pulling latest images..."
            docker pull rohanv7/booklio-frontend:latest || { echo 'Failed to pull frontend image'; exit 1; }
            docker pull rohanv7/booklio-backend:latest || { echo 'Failed to pull backend image'; exit 1; }

            echo "Starting Docker containers with Docker Compose..."
            docker-compose up -d || { echo 'Failed to start Docker containers'; exit 1; }

            echo "Deployment completed successfully!"
          EOF


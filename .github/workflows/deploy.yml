name: Build and Deploy Docker Images to EC2

on:
  push:
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build frontend Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/booklio-frontend:latest ./frontend

      - name: Build backend Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/booklio-backend:latest ./backend

      - name: Push frontend Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/booklio-frontend:latest

      - name: Push backend Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/booklio-backend:latest

  deploy_to_ec2:
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on EC2 with SSH Git clone
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            # Setup deploy key for GitHub access
            echo "${{ secrets.GITHUB_TOKEN }}" > ~/.ssh/booklio-deploy-key
            chmod 600 ~/.ssh/booklio-deploy-key

            # Ensure Git uses the token for HTTPS cloning
            git clone https://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@github.com/rohanvinkare/Booklio.git booklio-deploy
            cd booklio-deploy

            # Pull images
            docker pull $DOCKER_USERNAME/booklio-frontend:latest
            docker pull $DOCKER_USERNAME/booklio-backend:latest

            docker system prune -af
            docker-compose up -d
          EOF

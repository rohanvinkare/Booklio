version: '3'
services:
  backend:
    build:
      context: ./backend  # Path to the backend folder with Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env  # Path to the backend .env file
    networks:
      - booklio_network
    depends_on:
      - redis  # Ensure backend starts after Redis

  frontend:
    build:
      context: ./frontend  # Path to the frontend folder with Dockerfile
    ports:
      - "4173:80"  # Map Nginx port 80 to host port 80
    env_file:
      - ./frontend/.env  # Path to the frontend .env file
    depends_on:
      - backend  # Ensure frontend starts after backend
    networks:
      - booklio_network

  redis:
    image: redis
    container_name: my-redis
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - booklio_network
    mem_limit: 100m  # Set the maximum memory limit for Redis

networks:
  booklio_network:
    driver: bridge
